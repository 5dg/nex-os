name: Alpha integrity checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      canonical_candidate:
        description: Run two fresh canonical builds and retain blocked or qualified evidence
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEX_TOOLS_DIR: /tmp/nex-ci-tools
      GOCACHE: /tmp/nex-go-cache
      GOPATH: /tmp/nex-ci-tools/gopath
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Install verified pinned tools and frozen dependencies
        run: |
          ./scripts/bootstrap.sh
          ./scripts/bootstrap-rust.sh
          echo "$NEX_TOOLS_DIR/go/bin" >> "$GITHUB_PATH"
          echo "$NEX_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "$NEX_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$NEX_TOOLS_DIR/cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$NEX_TOOLS_DIR/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$NEX_TOOLS_DIR/rustup" >> "$GITHUB_ENV"
      - name: Reproduce generated contracts and semantic digest vectors
        run: ./scripts/check-contracts.sh --install-tools
      - name: Static checks
        run: |
          python3 -m unittest discover -s tests/release -p 'test_*.py'
          go vet ./...
          go test -mod=readonly -race ./...
          cd apps/workspace
          npm run typecheck
          npm test
      - name: Build and start the development stack
        run: make dev
      - name: Functional and negative checks
        run: make verify-local
      - name: Isolated current-source synthetic qualification
        run: |
          make down

          ./scripts/qualification.sh build-host
          ./scripts/qualification.sh up
          ./scripts/verify-qualification.sh
      - name: Terraform validation and mock tests
        run: |
          make terraform-check
          terraform -chdir=deploy/terraform test
      - name: Produce source SBOM and frozen-input inventory
        if: always()
        run: ./scripts/release-inventory.py .local/release-evidence
      - name: Install pinned vulnerability scanners
        run: |
          ./scripts/release-tools.sh
          echo "$NEX_TOOLS_DIR/bin" >> "$GITHUB_PATH"
      - name: Vulnerability release gate
        if: always()
        run: ./scripts/release-audit.py .local/release-evidence
      - name: Qualification image identities, OS SBOMs and vulnerability gate
        if: always()
        env:
          NEX_RELEASE_PROFILE: synthetic-qualification
        run: ./scripts/release-audit.py "$PWD/.local/qualification-release-evidence"
      - name: Retain release evidence including incomplete scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-integrity-release-evidence
          path: |
            .local/release-evidence
            .local/qualification-release-evidence
          include-hidden-files: true
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: |
          if test -f .local/qualification-restore/synthetic-qualification.state; then NEX_QUAL_PROJECT=nex-qualification-restore NEX_QUAL_STATE_DIR="$PWD/.local/qualification-restore" ./scripts/qualification.sh down; fi
          if test -f .local/qualification/synthetic-qualification.state; then ./scripts/qualification.sh down; fi
          make down

  canonical-candidate:
    # Routine pushes run foundation only. The publisher opts in with this marker
    # on the final reviewed main commit. The first step enforces exact case too.
    if: github.repository == '5dg/nex-os' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.canonical_candidate) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qualify-candidate]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NEX_TOOLS_DIR: /tmp/nex-ci-tools
      PYTHONDONTWRITEBYTECODE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    outputs:
      subject_sha256: ${{ steps.subject.outputs.sha256 }}
      artifact_id: ${{ steps.retain.outputs.artifact-id }}
      artifact_digest: ${{ steps.retain.outputs.artifact-digest }}
    steps:
      - name: Require exact trusted main
        id: trusted_main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == '5dg/nex-os' && "$GITHUB_REF" == 'refs/heads/main' ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Capture the exact trusted main source
        run: python3 -B scripts/candidate.py capture --output /tmp/nex-ci-candidate
      - name: Record reviewed measured second-build admission
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, re, subprocess
          candidate = json.loads(pathlib.Path('/tmp/nex-ci-candidate/candidate.json').read_text())
          revision = os.environ['GITHUB_SHA']
          source_digest = candidate['source']['inputs']['sha256']
          if not re.fullmatch(r'[0-9a-f]{40}', revision) or candidate['source']['revision'] != revision:
              raise SystemExit('Captured source differs from trusted main commit')
          if not isinstance(source_digest, str) or not re.fullmatch(r'[0-9a-f]{64}', source_digest):
              raise SystemExit('Captured source input digest is invalid')
          docker_environment = {key: value for key, value in os.environ.items() if key not in ('DOCKER_HOST', 'DOCKER_CONTEXT', 'DOCKER_TLS', 'DOCKER_TLS_VERIFY', 'DOCKER_CERT_PATH')}
          observed = subprocess.run(['docker', '--host=unix:///var/run/docker.sock', 'info', '--format', '{{json .Driver}}'], env=docker_environment, capture_output=True, text=True, check=True, timeout=30)
          driver = json.loads(observed.stdout)
          if not isinstance(driver, str) or not re.fullmatch(r'[A-Za-z0-9_.-]{1,64}', driver):
              raise SystemExit('Actual Docker storage driver is unavailable')
          policy = {'schema_version': 1, 'kind': 'measured-second-build-v1', 'source_input_sha256': source_digest, 'docker_driver': driver,
              'minimum_estimated_peak_additional_bytes': 8589934592, 'safety_margin_bytes': 2147483648, 'reserve_bytes': 2147483648,
              'approval': {'authority': 'root', 'decision': 'approved', 'record': 'docs/architecture/ALPHA04_RELEASE_CONTRACT.md#measured-second-build-admission; root review 2026-10-28; trusted main ' + revision}}
          path = pathlib.Path('/tmp/nex-ci-second-build-policy.json')
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as output:
              os.fchmod(output.fileno(), 0o600)
              json.dump(policy, output, indent=2)
              output.write('\n')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('NEX_CANONICAL_SECOND_ADMISSION_POLICY=' + str(path) + '\n')
          PYCODE
      - name: Prepare pinned verification tools outside the captured source
        run: |
          ./scripts/bootstrap.sh
          ./scripts/bootstrap-rust.sh
          ./scripts/release-tools.sh
          echo "$NEX_TOOLS_DIR/go/bin" >> "$GITHUB_PATH"
          echo "$NEX_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$NEX_TOOLS_DIR/cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_HOME=$NEX_TOOLS_DIR/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$NEX_TOOLS_DIR/rustup" >> "$GITHUB_ENV"
      - name: Execute canonical candidate with capacity and overlap admission
        run: bash /tmp/nex-ci-candidate/source/scripts/candidate-pipeline.sh /tmp/nex-ci-candidate/candidate.json 10.231.0.0/20
      - name: Prepare evidence even when setup or the canonical build is blocked
        if: always() && steps.trusted_main.outcome == 'success'
        run: |
          if test ! -f /tmp/nex-ci-candidate/candidate-bundle.tar.gz; then
            python3 -B /tmp/nex-ci-candidate/source/scripts/candidate-evidence.py seal --candidate /tmp/nex-ci-candidate/candidate.json || true
            python3 -B /tmp/nex-ci-candidate/source/scripts/candidate-evidence.py bundle --candidate /tmp/nex-ci-candidate/candidate.json --output /tmp/nex-ci-candidate/candidate-bundle.tar.gz
          fi
      - name: Record the immutable attestation subject
        id: subject
        if: always() && steps.trusted_main.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib
          bundle=pathlib.Path('/tmp/nex-ci-candidate/candidate-bundle.tar.gz')
          if bundle.is_file():
              with bundle.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
              with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha256='+digest+'\n')
          PY
      - name: Retain the non-secret candidate subject
        id: retain
        if: always() && steps.trusted_main.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha04-candidate-subject
          path: /tmp/nex-ci-candidate/candidate-bundle.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain non-secret candidate execution metadata
        if: always() && steps.trusted_main.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha04-candidate-execution-metadata
          path: |
            /tmp/nex-ci-candidate/candidate.json
            /tmp/nex-ci-candidate/release-manifest.json
            /tmp/nex-ci-candidate/pipeline.log
            /tmp/nex-ci-candidate/*admission*.json
            /tmp/nex-ci-candidate/evidence/*admission*.json
            /tmp/nex-ci-candidate/builds/*/manifest.json
          if-no-files-found: error
          retention-days: 30

  candidate-origin:
    needs: canonical-candidate
    if: always() && github.repository == '5dg/nex-os' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.canonical_candidate) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qualify-candidate]'))) && needs.canonical-candidate.outputs.subject_sha256 != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require exact trusted main
        id: trusted_main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == '5dg/nex-os' && "$GITHUB_REF" == 'refs/heads/main' ]]
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: alpha04-candidate-subject
          path: /tmp/retained-candidate
      - name: Bind the downloaded subject to the producer output
        env:
          EXPECTED_SUBJECT_SHA256: ${{ needs.canonical-candidate.outputs.subject_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib
          with pathlib.Path('/tmp/retained-candidate/candidate-bundle.tar.gz').open('rb') as stream:
              actual=hashlib.file_digest(stream,'sha256').hexdigest()
          if actual != os.environ['EXPECTED_SUBJECT_SHA256']: raise SystemExit('Downloaded candidate subject differs from producer')
          PY
      - name: Attest build and evidence origin; this is not release approval
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: /tmp/retained-candidate/candidate-bundle.tar.gz
      - name: Retain the separate signed origin bundle
        if: success() && steps.attest.outcome == 'success' && steps.attest.outputs.bundle-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha04-candidate-origin
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
