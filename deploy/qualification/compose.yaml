{
  "name": "nex-qualification",
  "services": {
    "postgres": {
      "image": "${NEX_POSTGRES_IMAGE:-nex-postgres:qualification}",
      "environment": {
        "POSTGRES_DB": "nex",
        "POSTGRES_USER": "nex",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/admin_database_password"
      },
      "entrypoint": [
        "/bin/sh",
        "/etc/nex/postgres-entrypoint.sh"
      ],
      "volumes": [
        "postgres-data:/var/lib/postgresql/data",
        "./postgres-entrypoint.sh:/etc/nex/postgres-entrypoint.sh:ro",
        "./pg_hba.conf:/etc/nex/pg_hba.conf:ro"
      ],
      "tmpfs": [
        "/run/pg-tls:mode=0700"
      ],
      "secrets": [
        "admin_database_password",
        "postgres_tls_cert",
        "postgres_tls_key"
      ],
      "ports": [
        "127.0.0.1:55432:5432"
      ],
      "networks": [
        "db-link"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U nex -d nex"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 30
      },
      "stop_grace_period": "75s"
    },
    "migrate": {
      "image": "${NEX_CONTROL_IMAGE:-nex-control:qualification}",
      "user": "${NEX_UID:-1000}:${NEX_GID:-1000}",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "environment": {
        "APP_ENV": "development",
        "NEX_PROFILE": "synthetic-qualification",
        "MODEL_PROVIDER": "development",
        "NO_PROXY": "issuer.nex.test,workspace.nex.test,postgres,opa,guard,control,model,executor,evidence,localhost,127.0.0.1",
        "DATABASE_URL_FILE": "/run/secrets/admin_database_url",
        "NEX_DB_CA_FILE": "/run/secrets/db_ca",
        "OIDC_ISSUER": "https://issuer.nex.test:9444"
      },
      "command": [
        "migrate"
      ],
      "profiles": [
        "tools"
      ],
      "secrets": [
        "admin_database_url",
        "db_ca"
      ],
      "networks": [
        "db-link"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        }
      },
      "stop_grace_period": "75s"
    },
