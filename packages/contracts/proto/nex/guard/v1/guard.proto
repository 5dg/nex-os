syntax = "proto3";
package nex.guard.v1;
option go_package = "github.com/5dg/nex-os/packages/contracts/gen/guardv1";

// Stage-one internal policy boundary. Evaluate is a decision, never an execution
// capability. Only the authenticated control plane supplies resolved facts.
service Guard {
  rpc CheckReadiness(ReadinessRequest) returns (ReadinessResponse);
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  rpc PrepareExecution(PrepareRequest) returns (PreparedOperation);
  rpc CompleteExecution(CompletionRequest) returns (ExecutionResponse);
  rpc ExecutionState(ExecutionRequest) returns (ExecutionResponse);
  rpc AuthorizeExecution(ExecutionRequest) returns (ExecutionResponse);
  rpc DecideApproval(ApprovalRequest) returns (ExecutionResponse);
}
message ExecutionRequest { string operation_id = 1; string request_digest = 2; }
message ExecutionResponse { bool allowed = 1; string state = 2; }
message ApprovalRequest { string approval_id = 1; string request_digest = 2; string actor_id = 3; string tenant_id = 4; bool approve = 5; }
message Actor {
  string id = 1;
  string tenant_id = 2;
  repeated string permissions = 3;
}
message Resource {
  string tenant_id = 1;
  string kind = 2;
  string classification = 3;
  repeated string reader_ids = 4;
  repeated string approved_classifications = 5;
}
message EvaluateRequest {
  Actor actor = 1;
  Resource resource = 2;
  string action = 3;
  bool delegation_valid = 4;
  repeated string delegation_permissions = 5;
  string data_classification = 6;
}
enum Effect {
  EFFECT_UNSPECIFIED = 0;
  DENY = 1;
  ALLOW = 2;
  REQUIRE_APPROVAL = 3;
}
message EvaluateResponse {
  Effect effect = 1;
  string reason_code = 2;
  string policy_version = 3;
  string policy_digest = 4;
}

// v2 operations use a kernel-owned manifest. Payload is canonical content from
// trusted records; request_digest uses the documented semantic field encoding.
message PrepareRequest { string job_id = 1; string operation_id = 2; }
message PreparedOperation { string payload_json = 1; string request_digest = 2; }
message CompletionRequest { string operation_id = 1; string request_digest = 2; string result_json = 3; }

message ReadinessRequest {}
message ReadinessResponse { bool ready = 1; string profile = 2; }
